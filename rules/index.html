<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rules | Palm Beach Project</title>

    <meta
        name="description"
        content="Palm Beach Project community rules."
    >

    <link rel="stylesheet" href="css/redirect.css">

</head>

<body>

    <div class="background">

        <div class="grid"></div>

        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>

    </div>


    <main class="redirect-container">

        <!-- Logo -->

        <div class="brand">

            <div class="brand-logo">
                PB
            </div>

            <div class="brand-text">

                <strong>PALM BEACH</strong>

                <span>PROJECT</span>

            </div>

        </div>


        <!-- Card -->

        <section class="redirect-card">

            <div class="icon">

                <svg
                    width="30"
                    height="30"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                >

                    <path
                        d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
                    />

                    <polyline points="14 2 14 8 20 8" />

                    <line
                        x1="16"
                        y1="13"
                        x2="8"
                        y2="13"
                    />

                    <line
                        x1="16"
                        y1="17"
                        x2="8"
                        y2="17"
                    />

                    <polyline points="10 9 9 9 8 9" />

                </svg>

            </div>


            <div class="label">
                COMMUNITY INFORMATION
            </div>


            <h1>
                Palm Beach Project
                <span>Rules</span>
            </h1>


            <p>
                You're being redirected to the official
                Palm Beach Project rules page.
            </p>


            <!-- Countdown -->

            <div class="countdown-wrapper">

                <div class="countdown">

                    <span id="countdown">
                        5
                    </span>

                </div>

                <div class="countdown-text">

                    Redirecting in
                    <strong>
                        <span id="seconds">5</span>
                    </strong>
                    seconds

                </div>

            </div>


            <!-- Progress -->

            <div class="progress">

                <div
                    class="progress-bar"
                    id="progressBar"
                ></div>

            </div>


            <!-- Actions -->

            <div class="actions">

                <a
                    href="https://luna.veryinsanee.space/r/pbp"
                    class="button primary"
                    id="continueButton"
                >

                    Continue to Rules

                    <span>→</span>

                </a>


                <a
                    href="/"
                    class="button secondary"
                >

                    Return Home

                </a>

            </div>


            <div class="notice">

                <span class="status-dot"></span>

                You are leaving the Palm Beach Project website.

            </div>

        </section>


        <footer>

            © <span id="year"></span>
            Palm Beach Project

        </footer>

    </main>


    <script src="js/redirect.js"></script>

</body>

</html>
